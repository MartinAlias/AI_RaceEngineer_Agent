[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "race-engineer"
version = "0.1.0"
description = "A virtual motorcycle race engineer for the terminal."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
re = "race_engineer.cli:app"
race-engineer = "race_engineer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/race_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
